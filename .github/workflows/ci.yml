# main에 들어가는 모든 변경을 배포 전에 검사한다: 타입 검사 · lint · 단위/화면 테스트 · 프로덕션 빌드.
# 실패한 커밋이 배포되지 않게 하려면 저장소 Settings → Branches에서 main 보호 규칙에 이 "check" 작업을 필수로 걸고,
# 배포 서비스에서도 "GitHub 검사 통과 후 배포"를 켠다.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# PR은 브랜치마다 한 그룹이라 새 커밋이 오면 이전 검사를 취소한다.
# main 푸시는 커밋(sha)마다 따로 그룹을 만든다 — 같은 그룹(ref)에 두면 여러 세션이 연달아 푸시할 때
# "higher priority waiting request"로 앞 커밋 검사가 취소돼 검사받지 못한 커밋이 생긴다
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: 타입 검사
        run: pnpm typecheck

      - name: lint
        run: pnpm lint

      - name: 단위·화면 테스트
        run: pnpm test

      - name: 프로덕션 빌드
        run: pnpm build

  # 프로덕션 빌드를 띄워 로비와 모든 게임 페이지를 브라우저로 열고 조작해, 에러가 하나라도 나면 실패 (e2e/)
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      - name: E2E 스모크
        run: pnpm e2e

      - name: 실패하면 리포트 올리기
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
