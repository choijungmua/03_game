# main에 들어가는 모든 변경을 배포 전에 검사한다: 타입 검사 · lint · 단위/화면 테스트 · 프로덕션 빌드.
# 실패한 커밋이 배포되지 않게 하려면 저장소 Settings → Branches에서 main 보호 규칙에 이 "check" 작업을 필수로 걸고,
# 배포 서비스에서도 "GitHub 검사 통과 후 배포"를 켠다.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # PR은 새 커밋이 오면 이전 검사를 취소하고, main은 커밋마다 끝까지 검사한다
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: 타입 검사
        run: pnpm typecheck

      - name: lint
        run: pnpm lint

      - name: 단위·화면 테스트
        run: pnpm test

      - name: 프로덕션 빌드
        run: pnpm build
