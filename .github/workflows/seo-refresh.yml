# 매달 네이버 검색어 트렌드를 다시 받아, 검색어가 크게 바뀐 게임만 SEO 문구를 새로 쓰고 PR로 올린다.
# 필요한 저장소 Secrets: NAVER_SEARCHAD_API_KEY, NAVER_SEARCHAD_SECRET, NAVER_SEARCHAD_CUSTOMER_ID,
#   NAVER_CLIENT_ID, NAVER_CLIENT_SECRET, ANTHROPIC_API_KEY
# 저장소 Settings → Actions → General → "Allow GitHub Actions to create and approve pull requests"를 켜야 PR이 만들어진다.
name: SEO 검색어 트렌드 갱신

on:
  schedule:
    - cron: "0 0 1 * *" # 매월 1일 09:00 (KST)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: 네이버 검색어 트렌드 수집
        run: pnpm seo:keywords --all
        env:
          NAVER_SEARCHAD_API_KEY: ${{ secrets.NAVER_SEARCHAD_API_KEY }}
          NAVER_SEARCHAD_SECRET: ${{ secrets.NAVER_SEARCHAD_SECRET }}
          NAVER_SEARCHAD_CUSTOMER_ID: ${{ secrets.NAVER_SEARCHAD_CUSTOMER_ID }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}

      - name: 검색어가 바뀐 게임 문구 다시 쓰기
        run: pnpm seo:generate --stale --missing
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - run: pnpm test

      - name: PR 만들기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain app/games/_games)" ]; then
            echo "바뀐 내용이 없습니다"
            exit 0
          fi
          branch="seo/trend-$(date +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add app/games/_games
          git commit -m "🔍 SEO : $(date +%Y-%m) 검색어 트렌드 반영"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "🔍 SEO : $(date +%Y-%m) 검색어 트렌드 반영" \
            --body "네이버 검색어 트렌드(seo-keywords.json)를 갱신하고, 검색어가 크게 바뀐 게임의 seo.ts를 다시 썼습니다. 게임과 다른 사실이 없는지 확인한 뒤 병합해 주세요."
